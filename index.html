<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriGrade AI — Computer Vision Quality Inspection</title>
    <meta name="description" content="Precision computer vision quality grading system for agricultural procurement centres. Objective diameter estimation, rot detection, and grade certificates." />
    
    <!-- Fontshare Fonts: Clash Display & Satoshi + Google JetBrains Mono -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0D0A] text-[#F4F1E8] font-sans antialiased min-h-screen selection:bg-[#D4FF3F] selection:text-[#0B0D0A] overflow-x-hidden">
    <!-- Tactile Noise Grain Overlay -->
    <svg class="pointer-events-none fixed inset-0 z-50 w-full h-full opacity-[0.035] mix-blend-overlay">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
